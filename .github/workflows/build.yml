# ABOUTME: Checks every change and builds signed, notarized universal releases.
# ABOUTME: Only version tags publish a GitHub Release; manual runs produce review artifacts.
name: Build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Report host OpenGL support
        run: |
          mkdir -p .build/rtsp
          clang -fobjc-arc -framework AppKit scripts/rtsp-graphics.m -o .build/rtsp/graphics-probe
          .build/rtsp/graphics-probe > .build/rtsp/graphics.log 2>&1
          cat .build/rtsp/graphics.log
      - name: Install check tools
        run: brew install xcodegen ffmpeg mediamtx actionlint shellcheck ripgrep
      - name: Run complete checks
        run: scripts/check
      - name: Preserve check diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: check-logs
          path: |
            .build/check-*.log
            .build/native-tests.log
            .build/service-tests.log
            .build/ui-tests.log
            .build/app-build.log
            .build/rtsp/*.log
          include-hidden-files: true
          retention-days: 7

  sign:
    needs: checks
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build tools
        run: brew install xcodegen
      - name: Build and notarize
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_BUILD: ${{ github.run_number }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [[ "$RELEASE_EVENT" == workflow_dispatch ]]; then
            RELEASE_REF=v1.0.0
          fi
          scripts/release-build "$RELEASE_REF" "$RELEASE_BUILD"
      - name: Preserve release diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-logs
          path: .build/release-*.log
          include-hidden-files: true
          retention-days: 7
      - name: Upload notarized artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: notarized-release
          path: |
            .build/release/CameraBar-*.zip
            .build/release/CameraBar-*.zip.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: sign
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: notarized-release
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/*.zip release/*.zip.sha256 --verify-tag --generate-notes --title "Camera Bar $RELEASE_TAG"
